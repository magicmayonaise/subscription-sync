[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subscription-sync"
version = "0.1.0"
description = "Gmail → LLM extraction → Notion subscription tracker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "anthropic>=0.40",
    "google-api-python-client>=2.114",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
]

[project.scripts]
subsync = "subscription_sync.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/subscription_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
